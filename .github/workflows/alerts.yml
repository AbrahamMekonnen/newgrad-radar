name: Deliver Job Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 16 * * *"
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Alert delivery queue to drain"
        type: choice
        options: [instant, daily, weekly]
        default: instant

permissions:
  contents: read
  actions: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt
      - name: Deliver pending alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          PYTHONUTF8: "1"
          DISPATCH_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$DISPATCH_MODE"
          if [ -z "$MODE" ]; then
            case "$SCHEDULE" in
              "0 16 * * *") MODE="daily" ;;
              "0 16 * * 1") MODE="weekly" ;;
              *) MODE="instant" ;;
            esac
          fi
          cd scraper
          python alert_worker.py --mode "$MODE"

      - name: Prepare newly queued alert applications
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autoapply.yml --ref main -f mode=queue
