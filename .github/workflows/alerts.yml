name: Deliver Job Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt
      - name: Deliver pending instant alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PYTHONUTF8: "1"
        run: cd scraper && python alert_worker.py
