name: Jev Cleanup (continuous)

# Continuously cleans EXISTING data with Jev, in small rate-limit-friendly
# batches, until there's nothing left to do:
#   - interview questions: re-verify non-LeetCode rows and drop non-interview
#     junk. Each row is marked (quality_filter_version=jev-v1) once checked, so
#     runs converge to zero work — safe to run frequently, 24/7.
#   - jobs: fill missing experience level (and role/work-mode/sponsorship) from
#     the description for jobs that still lack a level.
# Jev is rate-limited (brand new), so keep batches small + low concurrency; the
# client retries 429s and everything falls back safely.

on:
  schedule:
    - cron: "*/20 * * * *" # every 20 minutes
  workflow_dispatch:
    inputs:
      q_limit:
        description: "Max questions to check this run"
        default: "800"
      j_limit:
        description: "Max jobs to classify this run"
        default: "300"

concurrency:
  group: jev-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt

      - name: Jev cleanup batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          QL="${{ github.event.inputs.q_limit }}"; QL="${QL:-800}"
          JL="${{ github.event.inputs.j_limit }}"; JL="${JL:-300}"
          # Questions: terminating (marks each row checked). Non-fatal.
          python backfill_jev_questions.py --limit "$QL" --batch 12 --workers 2 \
            || echo "::warning::question cleanup batch had errors (will resume next run)"
          # Jobs: fill missing experience level from descriptions. Non-fatal.
          python backfill_jev_jobs.py --only-missing --limit "$JL" --workers 2 \
            || echo "::warning::job cleanup batch had errors (will resume next run)"

      - name: Summary
        if: always()
        run: |
          echo "## Jev Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "Re-verifies non-LeetCode interview questions (drops non-interview junk) and fills missing job experience levels, in small batches. Converges to zero work as data gets cleaned." >> $GITHUB_STEP_SUMMARY
