name: Scrape Jobs

# Primary job scraper - runs daily and coordinates with other workflows
#
# Required Secrets:
#   SUPABASE_URL          - Supabase project URL
#   SUPABASE_SERVICE_KEY  - Supabase service role key (not anon key)
#   GEMINI_API_KEY        - Google Gemini API key for job classification
#
# Optional Secrets (for additional sources):
#   ADZUNA_APP_ID         - Adzuna API app ID
#   ADZUNA_APP_KEY        - Adzuna API key
#   USAJOBS_API_KEY       - USAJobs API key
#   USAJOBS_EMAIL         - Email registered with USAJobs
#   GITHUB_TOKEN          - GitHub token (auto-provided, enhances rate limits)
#
# Related Workflows:
#   - api_sources.yml     - Daily at 6am PT (before this workflow)
#   - ats_sources.yml     - Daily at 7am PT (parallel with this)
#   - weekly_sources.yml  - Weekly on Sundays
#   - newsletters.yml     - Weekly on Sundays
#   - funding_scan.yml    - Weekly on Sundays
#   - events.yml          - Tue/Fri event-triggered scraping

on:
  schedule:
    # Daily at 7am Pacific (14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to database"
        type: boolean
        default: false
      skip_notify:
        description: "Skip sending notifications"
        type: boolean
        default: false
      event_scrape:
        description: "Include event-based scraping"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 60 min headroom: scraping the expanded company universe + sources takes
    # ~35 min, and a too-tight cap KILLS a working run mid-flight (shows as a
    # random "job failed after a while" cancellation — the exact thing we're
    # avoiding). Cleanup is batched and the heavy AI-enrich is delegated to the
    # every-20-min enrich-jobs workflow, so steady state finishes well under this.
    timeout-minutes: 60
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Extra free LLM providers — the classifier/enricher falls through
          # these in order when one hits its quota (add the secret to enable).
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Government source (USAJobs) — the scraper skips it without these.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Web Push (browser/PWA notifications) sender.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          cd scraper
          # Refresh the company universe from the public new-grad feed (adds
          # newly-appearing companies), then sync companies.py -> the companies
          # table so jobs + recruiters cover the full set. Non-fatal if either
          # hiccups; the scrape still runs on the companies we already have.
          python import_companies.py || echo "::warning::company import failed; using existing list"
          python sync_companies.py || echo "::warning::company sync failed"
          # Notifications ON by default: ntfy push needs no provider/keys and
          # works on its own; email just no-ops gracefully until an email
          # provider (BREVO/SMTP/RESEND) is configured. Pass skip_notify=true on
          # a manual run to suppress all notifications.
          # --add-h1b-flags populates sponsorship_status (H1B sponsor / no
          # sponsor) so the Sponsorship filter works — critical for
          # international students. Without it every job stays "unknown".
          ARGS="--add-h1b-flags"
          if [[ "${{ inputs.skip_notify }}" == "true" ]]; then
            ARGS="$ARGS --skip-notify"
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          if [[ "${{ inputs.event_scrape }}" == "true" ]]; then
            ARGS="$ARGS --event-scrape"
          fi
          python radar.py $ARGS
          # AI-enrich jobs whose experience level the title classifier missed
          # (fills level + opportunistic salary/sponsorship, flags non-jobs).
          # Budgeted per run; the incremental grind covers the rest over days.
          if [[ "${{ inputs.dry_run }}" != "true" ]]; then
            # Small inline enrich for freshly-scraped jobs; the dedicated
            # enrich-jobs workflow (every 20 min) does the heavy backlog, so keep
            # this light to avoid pushing the run toward the timeout.
            python enrich_jobs.py --limit 150 || echo "::warning::job enrichment had errors"
            # As soon as new jobs land, match them to users' auto-apply criteria
            # and prepare the applications — no waiting for a separate schedule.
            # Non-fatal: these are post-scrape side effects; a failure here must
            # not fail the run and discard an otherwise-successful scrape.
            python -m autoapply.rules --limit 30 || echo "::warning::autoapply rules had errors"
            python -m autoapply.prepare_worker --limit 100 || echo "::warning::autoapply prepare had errors"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Job Scraper Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Primary sources: SimplifyJobs, Greenhouse, Lever, Ashby" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See other workflow runs for additional sources:" >> $GITHUB_STEP_SUMMARY
          echo "- API Sources (Adzuna, RemoteOK, USAJobs)" >> $GITHUB_STEP_SUMMARY
          echo "- ATS Sources (Workday, SmartRecruiters, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Weekly Sources (GitHub repos, bootcamps, VC portfolios)" >> $GITHUB_STEP_SUMMARY
