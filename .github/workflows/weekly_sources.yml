name: Weekly Sources

on:
  schedule:
    # Weekly on Sunday at 5am Pacific (12:00 UTC) - before other scrapes
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "Specific source to run (all, github, bootcamps, vc, hackathons)"
        default: "all"
        required: false
      dry_run:
        description: "Run without writing to database"
        type: boolean
        default: false

jobs:
  # GitHub New Grad Repos (community-curated lists)
  github-repos:
    runs-on: ubuntu-latest
    if: github.event.inputs.source == 'all' || github.event.inputs.source == 'github' || github.event.inputs.source == ''

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub repo jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')

          from sources.github_repos import fetch_all_github_repos, GITHUB_REPOS
          from db import upsert_jobs
          from classifier import classify_jobs, detect_role_types
          from companies import COMPANIES, COMPANY_NAME_TO_SLUG, COMPANY_TOKEN_TO_SLUG, resolve_company_slug, company_info_for
          import hashlib

          dry_run = '${{ inputs.dry_run }}' == 'true'
          if dry_run:
              print('=== DRY RUN MODE ===')

          def normalize_company(raw_company):
              if not raw_company:
                  return None
              raw_lower = raw_company.lower().strip()
              if raw_lower in COMPANIES:
                  return raw_lower
              if raw_lower in COMPANY_NAME_TO_SLUG:
                  return COMPANY_NAME_TO_SLUG[raw_lower]
              if raw_lower in COMPANY_TOKEN_TO_SLUG:
                  return COMPANY_TOKEN_TO_SLUG[raw_lower]
              variations = [
                  raw_lower.replace(' ', '-'),
                  raw_lower.replace('.', ''),
              ]
              for var in variations:
                  if var and var in COMPANIES:
                      return var
                  if var and var in COMPANY_NAME_TO_SLUG:
                      return COMPANY_NAME_TO_SLUG[var]
              return None

          def generate_job_id(company_slug, title, url):
              id_string = f'{company_slug}|{title}|{url}'
              return hashlib.md5(id_string.encode()).hexdigest()[:12]

          def normalize_job(raw, company_slug):
              company_info = company_info_for(company_slug)
              location = raw.get('location', 'Remote')
              if isinstance(location, list):
                  location = ', '.join(location[:3]) if location else 'Remote'
              job_id = generate_job_id(company_slug, raw['title'], raw['url'])
              return {
                  'id': job_id,
                  'company_slug': company_slug,
                  'company_name': company_info['name'],
                  'title': raw['title'],
                  'location': location or 'Remote',
                  'url': raw['url'],
                  'tier': company_info['tier'],
                  'role_types': detect_role_types(raw['title']),
                  'source': raw.get('source', 'github-repo'),
                  'posted': raw.get('posted'),
              }

          print(f'GitHub repos to scan: {len(GITHUB_REPOS)}')
          for repo in GITHUB_REPOS:
              print(f'  - {repo[\"owner\"]}/{repo[\"repo\"]}')

          print('\\nFetching jobs from GitHub repos...')
          try:
              all_jobs = fetch_all_github_repos()
              print(f'Total raw jobs: {len(all_jobs)}')
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)

          # Normalize and filter
          normalized = []
          for job in all_jobs:
              company_slug = resolve_company_slug(job.get('company', ''))
              if company_slug:
                  normalized.append(normalize_job(job, company_slug))

          print(f'After filtering to target companies: {len(normalized)}')

          # Dedupe
          seen = {}
          for job in normalized:
              if job['id'] not in seen:
                  seen[job['id']] = job
          deduped = list(seen.values())
          print(f'After dedup: {len(deduped)}')

          # Classify and upsert
          if deduped:
              print('Classifying jobs...')
              classified = classify_jobs(deduped)
              print(f'After classification: {len(classified)} new grad positions')

              if not dry_run:
                  print('Upserting to database...')
                  new_count, updated_count, _ = upsert_jobs(classified, False)
                  print(f'New jobs: {new_count}, Updated: {updated_count}')
              else:
                  print('[DRY RUN] Would upsert jobs')
                  for job in classified[:10]:
                      print(f'  - {job[\"title\"]} at {job[\"company_name\"]}')

          print('Done!')
          "

      - name: Summary
        if: always()
        run: |
          echo "## GitHub Repos Jobs" >> $GITHUB_STEP_SUMMARY
          echo "Scanned community-curated new grad job lists from GitHub" >> $GITHUB_STEP_SUMMARY

