name: Enrich Recruiters

# Keeps the recruiters table filled for every company we have, and drains the
# user request queue. Runs daily, but it's cheap: enrich.py skips any company
# that already has fresh recruiters (<45 days), so after the initial fill each
# run only sources NEW/stale companies plus whatever users requested.

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-source ALL companies even if fresh (spends more search credits)"
        type: boolean
        default: false
      limit:
        description: "Max companies to process per run (parallelized, so this finishes well within the timeout; grind covers the rest over days)"
        type: string
        default: "300"

jobs:
  enrich-recruiters:
    runs-on: ubuntu-latest
    # Recruiter sourcing is slow per company (search + GitHub pattern learning +
    # SMTP). Give it headroom and keep the per-run limit modest so a run finishes
    # instead of being cancelled at the timeout (the grind covers the rest daily).
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      - name: Enrich recruiters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          # Used by email_intel to learn a company's email pattern from public
          # GitHub commit authors (higher rate limit than anonymous).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
          # Companies are enriched concurrently (mostly network wait on search +
          # SMTP), so the run finishes within the timeout instead of idling. Tune
          # here if search-provider rate limits bite.
          RECRUITER_WORKERS: "6"
        run: |
          cd scraper
          LIMIT="${{ inputs.limit }}"; LIMIT="${LIMIT:-300}"
          # 0) Keep the companies table in sync with companies.py (so newly
          #    imported companies are covered by recruiter enrichment).
          python sync_companies.py || echo "::warning::company sync failed"
          # 1) Fill every company that lacks fresh recruiters (or all, if refresh).
          if [[ "${{ inputs.refresh }}" == "true" ]]; then
            python -m recruiters.enrich --limit "$LIMIT" --refresh || echo "::warning::enrich had errors; partial results were saved incrementally"
          else
            python -m recruiters.enrich --limit "$LIMIT" || echo "::warning::enrich had errors; partial results were saved incrementally"
          fi
          # 2) Drain the user request queue (companies people asked for).
          python -m recruiters.enrich --from-requests --limit 100 || echo "::warning::request-queue processing had errors"

      - name: Summary
        if: always()
        run: |
          echo "## Recruiter Enrichment" >> $GITHUB_STEP_SUMMARY
          echo "Fills recruiters for all companies (skips fresh <45d) + drains the request queue." >> $GITHUB_STEP_SUMMARY
