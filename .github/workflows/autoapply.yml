name: Auto-Apply Pipeline

# Filter-based auto-apply, built to scale across many users:
#   match  — expand every user's saved criteria into matching jobs, queue them
#   prepare (x4 in parallel) — each worker CLAIMS a disjoint batch (migration
#            041's FOR UPDATE SKIP LOCKED) and fills + AI-drafts it. Add shards
#            to serve more users with no double-processing.
# Submission stays human-in-the-loop (final CAPTCHA in the user's own browser).

on:
  schedule:
    - cron: "0 * * * *" # hourly catch-all; on-demand dispatch handles the rest
  workflow_dispatch:
    inputs:
      per_user_limit:
        description: "Max jobs to queue per user per run"
        type: string
        default: "30"
      mode:
        description: "'submit' = only drain the submit queue (skip match/prepare)"
        type: string
        default: ""

jobs:
  match:
    if: ${{ inputs.mode != 'submit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt
      - name: Queue matching jobs for all users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          LIMIT="${{ inputs.per_user_limit }}"; LIMIT="${LIMIT:-30}"
          python -m autoapply.rules --limit "$LIMIT" || echo "::warning::rules matching had errors"

  prepare:
    needs: match
    if: ${{ inputs.mode != 'submit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      models: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4] # 4 parallel workers; claim RPC keeps batches disjoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt
      - name: Prepare claimed applications (shard ${{ matrix.shard }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python -m autoapply.prepare_worker --limit 100 || echo "::warning::prepare worker had errors"

  # Drain the submit queue: post CAPTCHA-FREE forms the user sent with "Submit
  # for me"; captcha-gated ones bounce back to 'prepared' with a note. Runs on
  # every trigger (schedule + dispatch) and no-ops when the queue is empty.
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt
      - name: Submit queued captcha-free applications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python -m autoapply.submit_worker --limit 100 || echo "::warning::submit worker had errors"
