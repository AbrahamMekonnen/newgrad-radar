name: Auto-Apply Pipeline

# Runs the filter-based auto-apply pipeline a few times a day:
#   1. rules.py         — expand each user's saved criteria into matching jobs,
#                         queue the new ones
#   2. prepare_worker   — fill + AI-draft each queued application and store it
#                         as 'prepared' for the user to review + submit
# Submission stays human-in-the-loop (final CAPTCHA in the user's own browser).

on:
  schedule:
    - cron: "0 * * * *" # hourly catch-all; on-demand dispatch handles the rest
  workflow_dispatch:
    inputs:
      per_user_limit:
        description: "Max jobs to queue per user per run"
        type: string
        default: "30"

jobs:
  autoapply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt
          pip install beautifulsoup4

      - name: Run auto-apply pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          LIMIT="${{ inputs.per_user_limit }}"; LIMIT="${LIMIT:-30}"
          # 1) queue matching jobs for every user with filter-based auto-apply on
          python -m autoapply.rules --limit "$LIMIT" || echo "::warning::rules matching had errors"
          # 2) prepare everything pending (deterministic fill + AI drafts)
          python -m autoapply.prepare_worker --limit 100 || echo "::warning::prepare worker had errors"

      - name: Summary
        if: always()
        run: |
          echo "## Auto-Apply Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "Matched saved criteria -> queued -> prepared applications for review." >> $GITHUB_STEP_SUMMARY
