name: Weekly Funding Scan

on:
  schedule:
    # Weekly on Sunday at 6am Pacific (13:00 UTC)
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Look back N days for funding"
        default: "90"
        required: false
      discover:
        description: "Try to discover career pages"
        type: boolean
        default: true
      verbose:
        description: "Print detailed output"
        type: boolean
        default: true

jobs:
  funding-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: Run funding scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          python funding_scan.py \
            --days ${{ github.event.inputs.days || '90' }} \
            ${{ github.event.inputs.discover == 'true' && '--discover' || '' }} \
            ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }} \
            --output funding_results.json

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: funding-scan-results
          path: scraper/funding_results.json
          retention-days: 30

      - name: Summary
        run: |
          echo "## Funding Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scraper/funding_results.json ]; then
            COUNT=$(jq '.total_count' scraper/funding_results.json)
            echo "Found **$COUNT** recently funded companies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Top 10 Hot Hiring Opportunities" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.companies[:10] | .[] | "- **\(.company_name)**: \(.funding_amount // "N/A") (\(.round_type // "Unknown")) - [\(.careers_url // "No career page")](\(.careers_url // "#"))"' scraper/funding_results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file generated" >> $GITHUB_STEP_SUMMARY
          fi
