name: Refresh Greeting Lines

# Weekly: regenerate the dashboard's fun greeting-line pool via the LLM chain and
# store it in site_content. The app rotates through these by time bucket, so the
# subtitle stays fresh without any runtime AI cost.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  refresh-greetings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      - name: Generate greeting lines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python generate_greetings.py || echo "::warning::greeting generation failed; existing lines kept"
