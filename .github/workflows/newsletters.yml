name: Weekly Newsletter Jobs

on:
  schedule:
    # Run every Sunday at 6 AM UTC (before the daily scrape)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing to database'
        required: false
        default: 'false'
        type: boolean

jobs:
  fetch-newsletter-jobs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch newsletter jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')

          from sources.newsletters import fetch_all_newsletter_jobs
          from db import upsert_jobs
          from classifier import classify_jobs
          from companies import COMPANIES, COMPANY_NAME_TO_SLUG, COMPANY_TOKEN_TO_SLUG
          import hashlib

          # Check for dry run
          dry_run = '${{ inputs.dry_run }}' == 'true'
          if dry_run:
              print('=== DRY RUN MODE ===')

          def normalize_company(raw_company):
              if not raw_company:
                  return None
              raw_lower = raw_company.lower().strip()
              if raw_lower in COMPANIES:
                  return raw_lower
              if raw_lower in COMPANY_NAME_TO_SLUG:
                  return COMPANY_NAME_TO_SLUG[raw_lower]
              if raw_lower in COMPANY_TOKEN_TO_SLUG:
                  return COMPANY_TOKEN_TO_SLUG[raw_lower]
              variations = [
                  raw_lower.replace(' ', '-'),
                  raw_lower.replace('.', ''),
                  raw_lower.replace('.', '-'),
                  raw_lower.split()[0] if ' ' in raw_lower else None,
              ]
              for var in variations:
                  if var and var in COMPANIES:
                      return var
                  if var and var in COMPANY_NAME_TO_SLUG:
                      return COMPANY_NAME_TO_SLUG[var]
              return None

          def generate_job_id(company_slug, title, url):
              id_string = f'{company_slug}|{title}|{url}'
              return hashlib.md5(id_string.encode()).hexdigest()[:12]

          def normalize_job(raw, company_slug):
              company_info = COMPANIES[company_slug]
              location = raw.get('location', 'Remote')
              job_id = generate_job_id(company_slug, raw['title'], raw['url'])
              return {
                  'id': job_id,
                  'company_slug': company_slug,
                  'company_name': company_info['name'],
                  'title': raw['title'],
                  'location': location,
                  'url': raw['url'],
                  'tier': company_info['tier'],
                  'role_types': [],
                  'source': raw['source'],
                  'posted': raw.get('posted'),
              }

          # Fetch newsletter jobs
          print('Fetching newsletter jobs...')
          all_jobs = fetch_all_newsletter_jobs()
          print(f'Total raw jobs: {len(all_jobs)}')

          # Normalize and filter to target companies
          normalized = []
          for job in all_jobs:
              company_slug = normalize_company(job['company'])
              if company_slug and company_slug in COMPANIES:
                  normalized.append(normalize_job(job, company_slug))

          print(f'After filtering to target companies: {len(normalized)}')

          # Dedupe
          seen = {}
          for job in normalized:
              if job['id'] not in seen:
                  seen[job['id']] = job
          deduped = list(seen.values())
          print(f'After dedup: {len(deduped)}')

          # Classify
          print('Classifying jobs...')
          classified = classify_jobs(deduped)
          print(f'After classification: {len(classified)} new grad positions')

          # Upsert to database
          if not dry_run:
              print('Upserting to database...')
              new_count, updated_count = upsert_jobs(classified, False)
              print(f'New jobs: {new_count}, Updated: {updated_count}')
          else:
              print('[DRY RUN] Would upsert jobs')
              for job in classified[:10]:
                  print(f'  - {job[\"title\"]} at {job[\"company_name\"]}')

          print('Newsletter job fetch complete!')
          "

      - name: Summary
        run: |
          echo "## Newsletter Jobs Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Weekly newsletter job aggregation completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sources:**" >> $GITHUB_STEP_SUMMARY
          echo "- TLDR Jobs (jobs.tldr.tech)" >> $GITHUB_STEP_SUMMARY
          echo "- DiversifyTech (diversifytech.com)" >> $GITHUB_STEP_SUMMARY
          echo "- RSS-based newsletter feeds" >> $GITHUB_STEP_SUMMARY
