name: Scrape Interview Questions (Telegram)

# Telegram runs in its OWN workflow: its wide channel crawl + LLM extraction is
# too heavy to share the main interview-questions job (it was getting the whole
# run cancelled at the 50-min timeout, losing everything). Here it gets a
# dedicated timeout and a persisted cache so it actually completes and saves.

on:
  schedule:
    # Every 6 hours, offset from the main job (03:00, 09:00, 15:00, 21:00 UTC)
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Months of history to fetch"
        type: string
        default: "6"

jobs:
  scrape-telegram:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      # Persist the channel/entity/incremental cache across runs so discovery
      # stays warm (no cold re-crawl) and already-seen messages are skipped.
      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: |
            scraper/.cache
            scraper/sources/interview_questions/.telegram_entities.json
            scraper/sources/interview_questions/.telegram_channels.json
          key: telegram-cache-${{ github.run_id }}
          restore-keys: |
            telegram-cache-

      - name: Run Telegram scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Extra free LLM providers — the classifier/enricher falls through
          # these in order when one hits its quota (add the secret to enable).
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          MONTHS="${{ inputs.months }}"
          MONTHS="${MONTHS:-6}"
          python cli.py run telegram --months "$MONTHS" || echo "::warning::telegram run had errors; questions fetched before any failure were still saved incrementally"

      - name: Summary
        if: always()
        run: |
          echo "## Telegram Interview Question Scraper" >> $GITHUB_STEP_SUMMARY
          echo "Runs every 6 hours in its own job (dedicated timeout + warm cache)." >> $GITHUB_STEP_SUMMARY
