name: Enrich Job Filters

# Keeps the filter columns populated for NEW jobs so the jobs-page filters
# don't decay as the catalog grows. Both steps are incremental — they only fill
# rows still missing the value, never overwrite:
#   - salary_min/max + funding_stage  (reuses the card estimators via tsx)
#   - sponsorship_status              (reuses h1b_data known sponsors)
# Runs after the scrape cadence; safe to re-run.

on:
  schedule:
    - cron: "0 16 * * *" # daily, a couple hours after the main scrape
  workflow_dispatch:

jobs:
  enrich-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt

      - name: Populate sponsorship_status (H1B)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python backfill_sponsorship.py || echo "::warning::sponsorship backfill had errors"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Populate salary + funding (levels.fyi + tier + company map)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/backfill-filters.ts

      - name: Populate derived filters (experience split + high_paying badge)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python backfill_derived.py || echo "::warning::derived backfill had errors"

      - name: Populate diversity tags (conference sponsors, company-level)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python backfill_diversity.py || echo "::warning::diversity backfill had errors"
