name: Scrape Interview Questions

# Scrapes interview questions from multiple sources
# Runs daily after the main job scraper

on:
  schedule:
    # Daily at 9am Pacific (16:00 UTC) - 2 hours after main scraper
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to database"
        type: boolean
        default: false

jobs:
  scrape-interviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: Run interview question scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python cli.py run --dry-run
          else
            python cli.py run
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Interview Question Scraper Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sources: Blind, Glassdoor, Reddit, Dev.to, Hacker News" >> $GITHUB_STEP_SUMMARY
