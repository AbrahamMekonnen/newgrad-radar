name: Scrape Interview Questions

# Scrapes interview questions from all configured sources.
# Runs several times a day to keep the interview-prep section fresh.

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to database"
        type: boolean
        default: false
      months:
        description: "Months of history to fetch"
        type: string
        default: "6"

jobs:
  scrape-interviews:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      # Persist the scraper cache across runs. CI runners are ephemeral, so
      # without this every run would be a COLD Telegram discovery (hundreds of
      # search/recommendation calls) — which is what trips Telegram's flood
      # ban. The rolling key (run_id + restore-keys prefix) keeps a mutable
      # cache: it restores the most recent one and saves a fresh copy each run.
      # This keeps the warm entity cache (skip discovery within its TTL) and
      # the incremental seen-state (skip already-processed messages) alive.
      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: |
            scraper/.cache
            scraper/sources/interview_questions/.telegram_entities.json
            scraper/sources/interview_questions/.telegram_channels.json
          key: scraper-cache-${{ github.run_id }}
          restore-keys: |
            scraper-cache-

      - name: Run interview question scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Telegram (Telethon) — these were set in GitHub but never passed
          # to the process, so Telegram silently ran with no credentials.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          MONTHS="${{ inputs.months }}"
          MONTHS="${MONTHS:-6}"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python cli.py run-all --months "$MONTHS" --dry-run
          else
            # Run every configured source. Don't fail the whole workflow if a
            # few flaky sources error; the run still writes everything the
            # working sources produced.
            python cli.py run-all --months "$MONTHS" || echo "::warning::some sources failed; questions from working sources were still saved"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Interview Question Scraper Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runs every 6 hours across all configured sources" >> $GITHUB_STEP_SUMMARY
          echo "(company-wise LeetCode, tech-interview-handbook, HackerNews, Reddit, Dev.to, etc.)" >> $GITHUB_STEP_SUMMARY
