name: Scrape Interview Questions

# Scrapes interview questions from all configured sources.
# Runs several times a day to keep the interview-prep section fresh.

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to database"
        type: boolean
        default: false
      months:
        description: "Months of history to fetch"
        type: string
        default: "6"

jobs:
  scrape-interviews:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements-scrape.txt

      # Persist the scraper cache across runs. CI runners are ephemeral, so
      # without this every run would be a COLD Telegram discovery (hundreds of
      # search/recommendation calls) — which is what trips Telegram's flood
      # ban. The rolling key (run_id + restore-keys prefix) keeps a mutable
      # cache: it restores the most recent one and saves a fresh copy each run.
      # This keeps the warm entity cache (skip discovery within its TTL) and
      # the incremental seen-state (skip already-processed messages) alive.
      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: |
            scraper/.cache
            scraper/sources/interview_questions/.telegram_entities.json
            scraper/sources/interview_questions/.telegram_channels.json
          key: scraper-cache-${{ github.run_id }}
          restore-keys: |
            scraper-cache-

      - name: Run interview question scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Extra free LLM providers — the classifier/enricher falls through
          # these in order when one hits its quota (add the secret to enable).
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Telegram (Telethon) — these were set in GitHub but never passed
          # to the process, so Telegram silently ran with no credentials.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          MONTHS="${{ inputs.months }}"
          MONTHS="${MONTHS:-6}"
          # NOTE: telegram is excluded here and runs in its own workflow
          # (interview_questions_telegram.yml) — its wide crawl is too slow to
          # share this 60-min job and was getting the whole run cancelled at
          # the timeout, losing everything.
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python cli.py run-all --months "$MONTHS" --exclude telegram --dry-run
          else
            # Each scraper saves independently, but keep a failing exit code so
            # timeouts and broken sources are visible in GitHub Actions.
            python cli.py run-all --months "$MONTHS" --exclude telegram
          fi

      # AI-verify the noisy sources (HackerNews / unknown / gist leak comment
      # fragments past the heuristic filter). Marks non-questions is_junk=true so
      # the Interview Prep feed stays real questions only. Batched + provider
      # fallthrough; on LLM outage it keeps rows (never deletes blindly).
      - name: AI-verify scraped questions (remove non-questions)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python -m sources.interview_questions.ai_clean || echo "::warning::ai_clean had errors"

      - name: Summary
        if: always()
        run: |
          echo "## Interview Question Scraper Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runs every 6 hours across all configured sources" >> $GITHUB_STEP_SUMMARY
          echo "(company-wise LeetCode, tech-interview-handbook, HackerNews, Reddit, Dev.to, etc.)" >> $GITHUB_STEP_SUMMARY
