name: Enrich Jobs (AI, continuous free)

# Continuously fills job cards (experience / salary / sponsorship / real-job)
# from each job's stored description using the FREE LLM provider chain
# (Gemini -> Groq -> Cerebras -> Mistral -> ...), then DELETES the description
# once consumed so the DB stays lean. Runs often, in small batches, so the
# backlog is always being worked through at $0.
on:
  schedule:
    - cron: "*/20 * * * *" # every 20 minutes
  workflow_dispatch:
    inputs:
      limit:
        description: "How many jobs to enrich this run"
        default: "400"
        required: false

concurrency:
  group: enrich-jobs
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements-scrape.txt
      - run: cd scraper && pip install -r requirements-scrape.txt

      - name: Enrich a batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free LLM providers — the enricher falls through them in order as
          # each hits its quota, so it keeps classifying all day for free.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          cd scraper
          python enrich_jobs.py --limit "${{ github.event.inputs.limit || '400' }}" || echo "::warning::enrichment had errors (partial results saved)"
